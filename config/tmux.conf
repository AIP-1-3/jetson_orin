# 팀 공용 최소 tmux 설정 — SSH 가 끊겨도 작업(Claude Code, 학습)이 계속 돌게 하는 용도
#   새 세션: tmux new -s work    다시 붙기: tmux a -t work    빠져나오기(유지): Ctrl-b d

set -g mouse on                    # 마우스 스크롤/창 선택
set -g history-limit 50000         # 긴 학습 로그도 스크롤로 확인
set -g default-terminal "tmux-256color"
set -sg escape-time 10             # vim/Claude Code 에서 ESC 지연 제거
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 상태줄: 사용자@호스트 | 세션 이름 — 공용 장비에서 "누구 세션인지" 바로 보이게
set -g status-left-length 40
set -g status-left "#[bold]#(whoami)@#h #[default]| #S  "
set -g status-right "%m-%d %H:%M"
