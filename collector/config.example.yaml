# 수집기 설정 예시. 복사해서 쓴다: cp config.example.yaml /etc/ts-collector/config.yaml
# 비밀값은 여기 쓰지 않고 환경 변수로 넘긴다 (*_env 에 변수 이름). systemd 에서는 /etc/ts-collector/env.

mqtt:
  host: data.withio.net
  port: 1883
  username_env: MQTT_USERNAME      # 인증이 없으면 두 줄 지워도 된다
  password_env: MQTT_PASSWORD
  client_id: ts-collector-jetson   # 고정 id + clean_session false → 수집기 재시작 중 메시지를 브로커가 보관
  clean_session: false
  qos: 1
  keepalive: 30
  max_reconnect_delay_s: 15        # 브로커 재시작 후 15초 안에 다시 붙는다 (확인 기준: 1분)

influx:                            # InfluxDB 2.x 기준. 1.8 이면 org: "-", bucket: "db/autogen", token: "user:pass"
  url: http://data.withio.net:8086
  org: aip
  bucket: sensors
  token_env: INFLUX_TOKEN
  measurement: env                 # 센서 값: 태그 space, metric, sensor, ts_source / 필드 value, recv_lag_s
  status_measurement: collector_status   # 수집기 상태(1분마다): 결측 원인 추정에 쓴다
  flush_interval_s: 2

spool:                             # InfluxDB 에 못 쓰면 여기 모았다가 복구되면 다시 쓴다
  path: /var/lib/ts-collector/spool.lp
  max_mb: 200

time:
  max_future_skew_s: 120           # 센서 시각이 받은 시각보다 2분 넘게 미래면 센서 시계가 틀린 것으로 보고 받은 시각을 쓴다

heartbeat_interval_s: 60
dedup_window: 50000                # 재전송 판별에 기억할 최근 점 개수

aliases:                           # 이름 통일 (센서마다 이름이 달라도 저장은 한 이름으로). 필요하면 추가
  space: {}
  metric: {}

# 메시지 형식. 위에서부터 처음 맞는 항목 하나로 해석한다. 형식이 바뀌면 이 부분만 고친다 (코드 수정 불필요).
# 2026-10-20 data.withio.net 브로커에서 확인한 실제 형식 기준.
sources:
  # ChirpStack v4 업링크 (Milesight LoRaWAN 센서)
  # topic: application/<앱ID>/device/<devEui>/event/up
  # {"time":"2026-10-20T01:27:47.816+00:00",
  #  "deviceInfo":{"deviceName":"AM107-067999","devEui":"24e124128c067999",
  #                "tags":{"location":"실습실","spot":"후면 오른쪽"}},
  #  "object":{"co2":980,"temperature":23.4,"humidity":60.5,"tvoc":266,"activity":0,...}}
  # 기종마다 보내는 항목이 다르다: AM107 은 CO2 포함 전부, EM300-TH/EM320-TH 는 온습도(+배터리)만.
  - name: chirpstack-uplink
    topic: application/+/device/+/event/up
    format: json
    space: $.deviceInfo.tags.location
    sensor: "{topic.3}"                  # devEui
    timestamp: {path: $.time, unit: iso}
    metrics:
      co2: {path: $.object.co2}
      temperature: {path: $.object.temperature}
      humidity: {path: $.object.humidity}
      tvoc: {path: $.object.tvoc}
      pressure: {path: $.object.pressure}
      illumination: {path: $.object.illumination}
      activity: {path: $.object.activity}       # AM107 PIR 움직임 → 과제 5 사용 여부 참고 신호
      infrared: {path: $.object.infrared}
      battery: {path: $.object.battery}

  # 냉난방 실내기 상태 (xflow)
  # topic: xflow/hvacr/idu/<id>/status
  # {"ts":1792459580627,"values":{"개발실-실내기":{"current_temperature":22.3,"power":false,...}}}
  - name: hvac-indoor
    topic: xflow/hvacr/idu/+/status
    format: json
    space: $.values.@key                 # "개발실-실내기" → aliases.space 로 공간 이름에 맞출 것
    sensor: "{topic.3}"
    timestamp: {path: $.ts, unit: ms}
    metrics:
      hvac_power: {path: $.values.*.power}          # true=1, false=0
      hvac_mode: {path: $.values.*.mode}
      hvac_fan_speed: {path: $.values.*.fan_speed}
      hvac_target_temperature: {path: $.values.*.target_temperature}
      hvac_current_temperature: {path: $.values.*.current_temperature}
      hvac_current_humidity: {path: $.values.*.current_humidity}
      hvac_error_code: {path: $.values.*.error_code}
      hvac_online: {path: $.values.*.online}

  # 냉난방 실외기 상태 (외기 온도)
  - name: hvac-outdoor
    topic: xflow/hvacr/odu/+/status
    format: json
    space: $.values.@key
    sensor: "{topic.3}"
    timestamp: {path: $.ts, unit: ms}
    metrics:
      outdoor_temperature: {path: $.values.*.outdoor_temperature}
      odu_error_code: {path: $.values.*.error_code}
